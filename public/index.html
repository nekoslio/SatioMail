<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SatioMail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ea4335'/%3E%3Cpath d='M7 10.5l9 6.5 9-6.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='7' y='9.5' width='18' height='13' rx='2' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafd" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131314" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SatioMail" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view" class="login-view">
	<div class="login-card">
		<div class="login-logo">
			<svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true">
				<rect x="4" y="7" width="24" height="18" rx="2.4" fill="none" stroke="#ea4335" stroke-width="2.2"/>
				<path d="M5.5 9.5L16 17l10.5-7.5" fill="none" stroke="#ea4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>
		<h1 class="login-title">SatioMail</h1>
		<p class="login-sub">登录你的邮箱</p>
			<form id="login-form" class="login-form">
				<div class="login-field">
					<input id="login-password" type="password" class="text-input" placeholder=" " autocomplete="current-password" required />
					<label for="login-password">访问密码</label>
				</div>
				<div class="login-field" id="login-totp-field" hidden>
					<input id="login-totp" type="text" class="text-input" placeholder=" " inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
					<label for="login-totp">动态验证码</label>
				</div>
				<div id="turnstile-box" class="turnstile-box" hidden></div>
				<div id="login-error" class="login-error" hidden></div>
			<div class="login-actions">
				<span class="login-hint">凭据存储于 Workers Secrets，不在网页回显</span>
				<button id="login-btn" type="submit" class="btn btn-primary">登录</button>
			</div>
		</form>
	</div>
	<div class="login-footer">
		<span>SatioMail</span>
		<span>帮助</span>
		<span>隐私权</span>
		<span>条款</span>
	</div>
</div>

<!-- ============ APP ============ -->
<div id="app-view" class="app" hidden>

	<header class="topbar">
		<div class="topbar-left">
			<button id="btn-nav" class="icon-btn" title="折叠/展开侧栏">
				<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
					<rect class="bar bar-1" x="3" y="5" width="18" height="3" rx="1.5" />
					<rect class="bar bar-2" x="3" y="11" width="18" height="3" rx="1.5" />
					<rect class="bar bar-3" x="3" y="17" width="18" height="3" rx="1.5" />
				</svg>
			</button>
			<span class="logo">
				<svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
					<rect x="3" y="7.5" width="26" height="17" rx="2.2" fill="none" stroke="#ea4335" stroke-width="2.1"/>
					<path d="M5 9.5L16 17.5l11-8" fill="none" stroke="#ea4335" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span class="logo-text">SatioMail</span>
			</span>
		</div>

		<div class="search-bar">
			<span class="material-symbols-outlined search-mag">search</span>
			<input id="search-input" type="text" class="search-input" placeholder="搜索邮件" />
			<button id="search-clear" class="icon-btn search-clear" title="清除搜索" hidden>
				<span class="material-symbols-outlined">close</span>
			</button>
		</div>

		<div class="topbar-right">
			<button id="btn-theme" class="icon-btn" title="切换主题">
				<span class="material-symbols-outlined icon-sun">light_mode</span>
				<span class="material-symbols-outlined icon-moon">dark_mode</span>
			</button>
			<button id="btn-settings" class="icon-btn" title="设置">
				<span class="material-symbols-outlined">settings</span>
			</button>
			<button id="btn-logout" class="icon-btn" title="退出登录">
				<span class="material-symbols-outlined">logout</span>
			</button>
			<div class="account-chip" title="当前账号">
				<div id="account-avatar" class="avatar avatar-sm"></div>
				<span id="account-email" class="account-email"></span>
			</div>
		</div>
	</header>

	<div class="shell">
		<aside id="sidebar" class="sidebar">
			<button id="compose-btn" class="btn-compose">
				<span class="material-symbols-outlined">edit</span>
				<span class="compose-label">写邮件</span>
			</button>
			<nav id="folder-list" class="folder-list"></nav>
		</aside>

		<main id="main" class="main">
			<header id="toolbar" class="toolbar">
				<div class="toolbar-left">
					<h2 id="toolbar-title" class="toolbar-title">收件箱</h2>
					<span id="toolbar-subtitle" class="toolbar-subtitle"></span>
				</div>
				<div class="toolbar-actions">
					<button id="btn-compose-toolbar" class="icon-btn" title="写邮件">
						<span class="material-symbols-outlined">edit</span>
					</button>
					<button id="btn-back" class="icon-btn" title="返回收件箱" hidden>
						<span class="material-symbols-outlined">arrow_back</span>
					</button>
					<button id="btn-refresh" class="icon-btn" title="刷新">
						<span class="material-symbols-outlined">refresh</span>
					</button>
				</div>
			</header>

			<div id="split" class="split">
				<section id="list-pane" class="list-pane">
					<div id="list-loading" class="pane-loading" hidden>
						<div class="skeleton-line"></div>
						<div class="skeleton-line short"></div>
						<div class="skeleton-line"></div>
						<div class="skeleton-line short"></div>
						<div class="skeleton-line"></div>
						<div class="skeleton-line tiny"></div>
					</div>
					<div id="list-empty" class="pane-empty" hidden>
						<div class="empty-icon">
							<span class="material-symbols-outlined">inbox</span>
						</div>
						<p>这里还没有邮件</p>
					</div>
					<ul id="email-list" class="email-list"></ul>
					<div id="list-more" class="list-more" hidden>
						<button id="btn-load-more" class="btn btn-secondary">加载更多</button>
					</div>
				</section>

				<section id="reading-pane" class="reading-pane">
					<div id="reading-loading" class="pane-loading" hidden>
						<div class="skeleton-line tiny"></div>
						<div class="skeleton-line short"></div>
						<div class="skeleton-line"></div>
					</div>
					<div id="reading-empty" class="pane-empty">
						<div class="empty-icon">
							<span class="material-symbols-outlined">mail</span>
						</div>
						<p>选择一封邮件查看内容</p>
					</div>
					<article id="email-view" class="email-view" hidden></article>
				</section>
			</div>
		</main>
	</div>
</div>

<!-- ============ COMPOSE ============ -->
<div id="compose-overlay" class="overlay overlay-compose" hidden>
	<div class="compose-modal" role="dialog" aria-label="写邮件">
		<div class="compose-header">
			<h3 id="compose-title">新邮件</h3>
			<button id="compose-close" class="icon-btn" title="关闭">
				<span class="material-symbols-outlined">close</span>
			</button>
		</div>
		<form id="compose-form" class="compose-form">
			<div class="compose-field">
				<input id="compose-to" type="text" class="compose-input" placeholder="收件人" required />
			</div>
			<div class="compose-field">
				<input id="compose-cc" type="text" class="compose-input" placeholder="抄送" />
			</div>
			<div class="compose-field">
				<input id="compose-bcc" type="text" class="compose-input" placeholder="密送" />
			</div>
			<div class="compose-field">
				<input id="compose-subject" type="text" class="compose-input" placeholder="主题" />
			</div>
			<textarea id="compose-body" class="compose-body" placeholder="写点什么…"></textarea>
			<div id="attachment-list" class="attachment-list"></div>
			<div class="compose-footer">
				<label class="attach-btn" for="attachment-input" title="添加附件">
					<span class="material-symbols-outlined">attach_file</span>
				</label>
				<input id="attachment-input" type="file" multiple hidden />
				<div class="compose-actions">
					<button type="button" id="compose-cancel" class="btn btn-secondary">丢弃</button>
					<button type="submit" id="compose-send" class="btn btn-primary">
						<span class="btn-label">发送</span>
						<span class="material-symbols-outlined">send</span>
					</button>
				</div>
			</div>
		</form>
	</div>
</div>

<!-- ============ CONFIRM ============ -->
<div id="confirm-overlay" class="overlay overlay-confirm" hidden>
	<div class="confirm-modal" role="dialog">
		<h3 id="confirm-title">确认操作</h3>
		<p id="confirm-message" class="confirm-message"></p>
		<div class="confirm-actions">
			<button id="confirm-cancel" class="btn btn-secondary">取消</button>
			<button id="confirm-ok" class="btn btn-danger">永久删除</button>
		</div>
	</div>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="/app.js"></script>
</body>
</html>
