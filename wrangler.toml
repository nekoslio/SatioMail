name = "cfquickmail"
main = "src/index.ts"
compatibility_date = "2026-06-19"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
EMAIL_IMAP_HOST = "imaphz.qiye.163.com"
EMAIL_IMAP_PORT = "993"
EMAIL_SMTP_HOST = "smtphz.qiye.163.com"
EMAIL_SMTP_PORT = "465"
# Turnstile 人机验证站点密钥（公开值）；服务端密钥存于 Secrets（TURNSTILE_SECRET）
TURNSTILE_SITE_KEY = "0x4AAAAAAEgpQSr2CoHfHhSn"

# 自动头像来源顺序，逗号分隔，取值 gravatar / qq；空或 none 关闭自动加载
AVATAR_AUTO_SOURCE = "gravatar,qq"

# 头像存储：已绑定 Cloudflare KV（base64 存储自定义头像）
[[kv_namespaces]]
binding = "AVATAR_KV"
id = "12b2f2ca9b074a0d8e7a6b5c097d7692"

# 登录限流：跨实例全局限流（60 秒 5 次失败锁定）
[[kv_namespaces]]
binding = "LOGIN_KV"
id = "c6b1afaa63464eea83eef4aa4504fe09"
